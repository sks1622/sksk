<!doctype html>
<html
  lang="ko"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"spec","type":"string","label":"키/몸무게","default":"175/75 직장인의"},
    {"id":"headline","type":"string","label":"후킹 제목","default":"아메카지\n코디 4가지"},
    {"id":"outroQuestion","type":"string","label":"마지막 질문","default":"몇 번 코디가\n제일 좋아요?"},
    {"id":"outroCta","type":"string","label":"마지막 안내","default":"댓글로 번호 남겨주세요"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Pretendard"; font-weight: 500; src: url("assets/fonts/Pretendard-Medium.woff2") format("woff2"); }
      @font-face { font-family: "Pretendard"; font-weight: 700; src: url("assets/fonts/Pretendard-Bold.woff2") format("woff2"); }
      @font-face { font-family: "Pretendard"; font-weight: 900; src: url("assets/fonts/Pretendard-Black.woff2") format("woff2"); }
      :root {
        --paper: #efe6d6;   /* 생지 데님 밑단 같은 크림색 */
        --indigo: #1f2a44;  /* 원워시 인디고 */
        --rust: #b5562b;    /* 레드윙 오로 레거시 */
        --ink: #17130f;
        --font-display: "Pretendard";
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
      #root { width: 100%; height: 100%; font-family: var(--font-display); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1080" data-height="1920">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="2.2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <div id="look1" data-composition-id="look1" data-composition-src="compositions/look1.html"
        data-start="2.2" data-duration="2.2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <div id="look2" data-composition-id="look2" data-composition-src="compositions/look2.html"
        data-start="4.4" data-duration="2.2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <div id="look3" data-composition-id="look3" data-composition-src="compositions/look3.html"
        data-start="6.6" data-duration="2.2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <div id="look4" data-composition-id="look4" data-composition-src="compositions/look4.html"
        data-start="8.8" data-duration="2.2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="11" data-duration="3" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
